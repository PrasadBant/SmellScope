# Pre-registered Heuristics and SFI Configuration
# Fixed in Phase 1 before running any evaluation.
# Research Reference: Flood et al. EuroS&P 2024 / SmellScope Core Engine

# --- [PAPER] Five CSV Heuristics Configuration ---
heuristics:
  # UGT: Destination ports identified by Flood et al. as background traffic
  bg_ports: [0, 53, 67, 68, 111, 123, 137, 161, 179, 389, 427, 520, 1723, 1900]

  # WL: Edited Nearest Neighbour parameter (paper specifies k=4; implemented as 5 neighbours minus self)
  enn:
    k: 4
    subsample_cap: 5000
    tie_bias: "mislabelled"  # Ties broken in favour of mislabelled class

  # HDF: Single-feature Random Forest parameters
  hdf:
    n_estimators: 30
    max_depth: 8
    random_state: 42
    n_jobs: -1
    max_features_sample: 100

  # PDD & TC: Clustering and Cosine Similarity parameters
  clustering:
    elbow_max_k: 10
    n_pairs_per_cluster: 100
    random_state: 42
    tc_cosine_threshold: 0.95

# --- Baseline Random Forest Evaluator ---
baseline:
  rf:
    n_estimators: 100
    max_depth: null
    random_state: 42
    n_jobs: -1

# --- [PROPOSED] Shortcut Fragility Index (SFI) Configuration ---
sfi:
  k: 3                           # Number of top features selected by validation permutation importance
  deltas: [0.05, 0.10, 0.20, 0.30]  # Perturbation scale grid (multiples of feature IQR)
  n_null: 50                     # Number of random feature sets drawn for null distribution
  n_null_fallback: 20            # Allowed fallback under runtime constraint (logged in degradations)
  z_threshold: 2.0               # Pre-registered significance threshold: z >= 2.0 indicates excess fragility
  hdf_high: 0.90                 # Pre-registered high HDF threshold: HDF >= 0.90 indicates shortcut candidate
  quantiles: [0.01, 0.99]        # Bounded distribution quantiles for clipping perturbations
  min_test_examples: 10          # Minimum class-c test samples required to compute SFI (else n/a)
  random_state: 42

# --- [PROPOSED] Generalisation Gap Index (GGI) Configuration ---
ggi:
  min_groups: 3                  # Minimum number of groups required for GroupKFold
  lor_threshold: 0.95            # Reference threshold for Local Overfitting Ratio
  random_state: 42
