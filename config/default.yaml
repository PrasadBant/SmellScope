seed: 42
sampling:
  max_rows_per_class: 20000
split:
  train: 0.6
  val: 0.2
  test: 0.2
  stratified: true
runtime:
  budget_seconds: 300
rsm:
  policy:
    min_class_retention: 0.50
    min_cluster_retention: 0.25
    max_ablation_features: 10
paths:
  runs: "./runs"
  data: "./data"
  cache: "./cache"
  reports: "./reports"
