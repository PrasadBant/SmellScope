[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smellscope"
version = "2.0.0"
description = "Scientific Dataset Trust Audit Workstation for Network Intrusion Detection Systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SmellScope Architecture Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "pyyaml>=6.0",
    "joblib>=1.4.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "streamlit>=1.35.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smellscope*"]
